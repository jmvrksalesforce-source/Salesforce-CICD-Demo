<template>
    <lightning-card title="External Service Response">
        <div class="slds-p-around_medium">
            <lightning-button label="Get Response" onclick={handleGetResponse}></lightning-button>
            <div class="slds-m-top_medium">
                <lightning-textarea label="Status" value={status} disabled></lightning-textarea>
            </div>
            <div class="slds-m-top_medium">
                <lightning-textarea label="Status Code" value={statusCode} disabled></lightning-textarea>
            </div>
            <template if:true={errorMessage}>
                <div class="slds-m-top_medium slds-text-color_error">{errorMessage}</div>
            </template>
        </div>
    </lightning-card>
</template>
